spring:
  application:
    name: xian-tu
  profiles:
    active: local

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.xiantu.entity
  # 自定义 TypeHandler（灵根 JSON 字段）；@TableField 也显式指定了 handler
  type-handlers-package: com.xiantu.common.handler
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs              # OpenAPI JSON
  swagger-ui:
    path: /swagger-ui.html         # Swagger UI 入口
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.xaintu.xiantu.web.controller

jwt:
  # 生产环境务必更换为足够长（>=32 字节）的随机密钥
  secret: "xiantu-secret-key-please-change-in-production-1234567890"
  expiration-ms: 86400000   # 24 小时
